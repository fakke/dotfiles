# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix
set -g status-left ' #S'
set -g status-right ' #{?SSH_CONNECTION, #H |,} %a %b %d %H:%M %Z '
set -g window-status-format ' #I:#W'
set -g window-status-current-format ' #I:#W*'
set -g window-status-separator ''
set -g status-style '#{?client_prefix,bg=colour27 fg=white,bg=green fg=black}'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind R source-file ~/.config/tmux/tmux.conf
bind X kill-window
bind Q kill-session
bind C-q confirm-before -p "kill server? (y/n)" "run ~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh; run-shell 'tmux kill-server'"

bind o display-popup -E "~/.config/tmux/scripts/open-project"
bind f display-popup -E "~/.config/tmux/scripts/find-window"
bind r display-popup -E "~/.config/tmux/scripts/rename"

set -g mouse on
set -g set-titles on
set -g set-titles-string "#{session_name}/#{window_name}"
setw -g mode-keys vi
set -sg escape-time 0
set -g automatic-rename off
set -wg automatic-rename off
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

set -g update-environment "SSH_CONNECTION"
if-shell '[ -n "$SSH_CONNECTION" ]' {
    set -g status-left '#S'
    set -g status-style '#{?client_prefix,bg=red fg=white,bg=colour208 fg=black}'
}

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir '~/.config/tmux/resurrect'
set -g @resurrect-processes 'nvim ssh psql'
set -g @resurrect-strategy-nvim 'session'
set-hook -g after-new-session   'set -g automatic-rename off; set -wg automatic-rename off'
set-hook -g session-created     'set -g automatic-rename off; set -wg automatic-rename off'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval 0


run '~/.config/tmux/plugins/tpm/tpm'

